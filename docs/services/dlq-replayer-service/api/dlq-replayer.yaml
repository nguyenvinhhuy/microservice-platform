openapi: 3.1.0
info:
  title: DLQ Replayer Service API
  version: 1.0.0
  description: Implementation-accurate administrative API for DLQ inspection and replay.
servers:
  - url: http://localhost:8088
paths:
  /dlq/events:
    get:
      summary: List stored DLQ events
      operationId: listDlqEvents
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: PENDING
            enum:
              - PENDING
              - REPLAYED
              - SKIPPED
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
      responses:
        '200':
          description: Page of stored DLQ events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlqEventPage'
  /dlq/replay:
    post:
      summary: Replay one stored DLQ event
      operationId: replayDlqEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqReplayRequest'
      responses:
        '200':
          description: Replay accepted by current implementation.
        '500':
          description: Missing id, missing original topic, or other internal error.
  /dlq/skip:
    post:
      summary: Skip one stored DLQ event
      operationId: skipDlqEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqReplayRequest'
      responses:
        '200':
          description: Skip accepted by current implementation.
        '500':
          description: Missing id or other internal error.
components:
  schemas:
    DlqReplayRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        overrideTopic:
          type: string
          nullable: true
    DlqEventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        topic:
          type: string
        partition:
          type: integer
        offset:
          type: integer
          format: int64
        key:
          type: string
          nullable: true
        originalTopic:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - PENDING
            - REPLAYED
            - SKIPPED
        createdAt:
          type: string
          format: date-time
    DlqEventPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DlqEventResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
