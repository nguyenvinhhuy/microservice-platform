topic: product.events
producer: product-service
delivery: AT_LEAST_ONCE

description: >
  product-service writes product integration events to a transactional outbox and
  publishes them with ProductOutboxPublisher. The publisher claims PENDING and
  FAILED rows with FOR UPDATE SKIP LOCKED and retries with exponential backoff.

envelope:
  type: BaseEvent<T>
  fields:
    - eventId: ULID generated by EventFactory.
    - eventType: Stable semantic event type such as product.updated.
    - source: Always product-service.
    - eventTime: Instant generated by EventFactory.
    - aggregateId: product-{productId}.
    - aggregateVersion: Always 0 in the current implementation.
    - dataSchema: Versioned schema id such as product.updated.v1.
    - traceId: Current MDC trace id when available.
    - correlationId: Aggregate correlation key currently set to product-{productId}.
    - causationId: Always null in the current implementation.
    - data: Business payload defined below.

events:
  - eventType: product.updated
    dataSchema: product.updated.v1
    topic: product.events
    trigger:
      endpoint: PUT /api/v1/products/{id}
      condition: Every successful update.
    payload:
      type: ProductUpdatedEvent
      fields:
        - tenantId: int64
        - productId: int64
        - code: string
        - name: string
        - price: decimal
        - currency: string
    kafkaKey: product-{productId}

  - eventType: product.price.updated
    dataSchema: product.price.updated.v1
    topic: product.events
    trigger:
      endpoint: PUT /api/v1/products/{id}
      condition: Emitted only when stored price or currency changes.
    payload:
      type: ProductPriceUpdatedEvent
      fields:
        - tenantId: int64
        - productId: int64
        - price: decimal
        - currency: string
    kafkaKey: product-{productId}

not_published:
  - eventType: product.created
    reason: The current implementation does not emit a create event.
  - eventType: product.deleted
    reason: The current implementation does not emit a delete event.

consumed: []

notes:
  - Retry and DLQ topics are declared in KafkaTopicConfig but are not directly written by the local outbox publisher.
  - Downstream consumer ownership is not declared in this service-local spec; consumers must bind to event-contract schemas.
