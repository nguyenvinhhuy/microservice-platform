openapi: 3.1.0
info:
  title: Audit Log Service API
  version: 1.0.0
  description: Implementation-accurate query API for audit-log-service.
servers:
  - url: http://localhost:8005
paths:
  /api/audit-logs:
    get:
      summary: List audit logs for one tenant
      operationId: listAuditLogs
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
        - name: eventType
          in: query
          required: false
          schema:
            type: string
        - name: aggregateId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
      responses:
        '200':
          description: Tenant-scoped audit log page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
  /api/audit-logs/{id}:
    get:
      summary: Get one audit log row
      operationId: getAuditLogById
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Audit log entry found in same tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '404':
          description: Not found or tenant mismatch.
  /api/audit-logs/user/{userId}:
    get:
      summary: List audit logs for one user in one tenant
      operationId: getAuditLogsByUser
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Tenant/user-scoped audit log page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
  /api/audit-logs/search:
    get:
      summary: Search audit logs
      operationId: searchAuditLogs
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          schema:
            type: integer
            format: int64
        - name: eventType
          in: query
          required: false
          schema:
            type: string
        - name: aggregateId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Alias of list endpoint using same filter semantics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
components:
  schemas:
    AuditLogResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: string
        eventType:
          type: string
        source:
          type: string
          nullable: true
        tenantId:
          type: integer
          format: int64
          nullable: true
        userId:
          type: integer
          format: int64
          nullable: true
        aggregateId:
          type: string
          nullable: true
        aggregateType:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        causationId:
          type: string
          nullable: true
        receivedAt:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResponse'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
