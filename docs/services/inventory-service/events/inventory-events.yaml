topic: inventory.events
producer: inventory-service
delivery: AT_LEAST_ONCE

description: >
  inventory-service writes reservation and stock snapshot events to a
  transactional outbox and publishes them asynchronously with
  InventoryOutboxPublisher.

envelope:
  type: BaseEvent<T>
  fields:
    - eventId: ULID generated by EventFactory.
    - eventType: Stable semantic event type such as inventory.stock.reserved.
    - source: Always inventory-service.
    - eventTime: Instant generated by EventFactory.
    - aggregateId: order-{orderId} for reservation events, product-{productId} for stock snapshot events.
    - aggregateVersion: 0 for reservation events, inventory version for stock snapshot events.
    - dataSchema: Versioned schema id such as inventory.stock.updated.v1.
    - traceId: Current MDC trace id when available.
    - correlationId: Reservation correlation id when provided.
    - causationId: Always null in the current implementation.
    - data: Business payload defined below.

events:
  - eventType: inventory.stock.reserved
    dataSchema: inventory.stock.reserved.v1
    topic: inventory.events
    trigger:
      endpoint: POST /internal/inventory/reservations
      condition: Reservation persisted successfully.
    payload:
      type: StockReservedEvent
      fields:
        - orderId: uuid
        - tenantId: int64
        - amount: decimal
        - currency: string
        - paymentProvider: string
        - idempotencyKey: string
        - items: list of { productId, quantity }
    kafkaKey: "{orderId}"

  - eventType: inventory.stock.confirmed
    dataSchema: inventory.stock.confirmed.v1
    topic: inventory.events
    trigger:
      endpoint: POST /internal/inventory/reservations/{orderId}/confirm
      condition: Reservation moved to CONFIRMED.
    payload:
      type: StockConfirmedEvent
      fields:
        - orderId: uuid
        - tenantId: int64
        - items: list of { productId, quantity }
    kafkaKey: "{orderId}"

  - eventType: inventory.stock.released
    dataSchema: inventory.stock.released.v1
    topic: inventory.events
    trigger:
      endpoint: POST /internal/inventory/reservations/{orderId}/release
      condition: Reservation moved to RELEASED, including expiration-driven release.
    payload:
      type: StockReleasedEvent
      fields:
        - orderId: uuid
        - tenantId: int64
        - items: list of { productId, quantity }
    kafkaKey: "{orderId}"

  - eventType: inventory.stock.updated
    dataSchema: inventory.stock.updated.v1
    topic: inventory.events
    trigger:
      endpoint: reserve, confirm, or release flow
      condition: Emitted for every inventory row touched by the transaction.
    payload:
      type: StockUpdatedEvent
      fields:
        - tenantId: int64
        - productId: int64
        - totalStock: integer
        - reservedStock: integer
        - availableStock: integer
    kafkaKey: "{productId}"

consumed: []

notes:
  - Retry and DLQ topics are declared in KafkaTopicConfig but are not directly written by the local outbox publisher.
  - `StockReservationFailedEvent` exists in `event-contract` but is not emitted by the current inventory-service implementation.
