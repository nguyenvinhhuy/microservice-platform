topic: order.events
producer: order-service
delivery: AT_LEAST_ONCE

description: >
  order-service writes integration events to a transactional outbox and
  publishes them with OrderEventProducer. Failed publishes are retried with
  exponential backoff and may be published more than once.

envelope:
  type: BaseEvent<T>
  fields:
    - eventId: ULID generated by EventFactory.
    - eventType: Stable semantic event type such as order.created.
    - source: Always order-service.
    - eventTime: Instant generated by EventFactory.
    - aggregateId: String form of orderId.
    - aggregateVersion: Always 0 in the current implementation.
    - dataSchema: Versioned schema id such as order.created.v1.
    - traceId: Current MDC trace id when available.
    - correlationId: Request id propagated through the command flow.
    - causationId: Random UUID generated per command execution.
    - data: Business payload defined below.

events:
  - eventType: order.created
    dataSchema: order.created.v1
    topic: order.events
    trigger:
      endpoint: POST /orders
      condition: Reservation succeeded and order moved to RESERVED.
    payload:
      type: OrderCreatedEvent
      fields:
        - eventId: uuid
        - eventVersion: integer
        - correlationId: string
        - causationId: string
        - orderId: uuid
        - tenantId: int64
        - userId: int64
        - status: string
        - totalAmount: decimal
        - currency: string
        - timestamp: instant
    kafkaKey: "{orderId}"

  - eventType: order.paid
    dataSchema: order.paid.v1
    topic: order.events
    trigger:
      endpoint: POST /orders/{orderId}/pay
      condition: Payment charge and inventory confirm both succeeded.
    payload:
      type: OrderPaidEvent
      fields:
        - eventId: uuid
        - eventVersion: integer
        - correlationId: string
        - causationId: string
        - orderId: uuid
        - tenantId: int64
        - userId: int64
        - status: string
        - paymentId: uuid
        - timestamp: instant
    kafkaKey: "{orderId}"

  - eventType: order.failed
    dataSchema: order.failed.v1
    topic: order.events
    trigger:
      endpoint: POST /orders or POST /orders/{orderId}/pay
      condition: Reservation or payment flow failed and the order moved to FAILED.
    payload:
      type: OrderFailedEvent
      fields:
        - eventId: uuid
        - eventVersion: integer
        - correlationId: string
        - causationId: string
        - orderId: uuid
        - tenantId: int64
        - userId: int64
        - status: string
        - reason: string
        - timestamp: instant
    kafkaKey: "{orderId}"

  - eventType: order.cancelled
    dataSchema: order.cancelled.v1
    topic: order.events
    trigger:
      endpoint: POST /orders/{orderId}/cancel
      condition: Cancel command succeeded and the order moved to CANCELLED.
    payload:
      type: OrderCancelledEvent
      fields:
        - eventId: uuid
        - eventVersion: integer
        - correlationId: string
        - causationId: string
        - orderId: uuid
        - tenantId: int64
        - userId: int64
        - status: string
        - timestamp: instant
    kafkaKey: "{orderId}"

consumed: []

notes:
  - Retry and DLQ topics are declared in KafkaConfig but are not directly written by the local outbox publisher.
  - Downstream consumer ownership is not declared in this service-local spec; consumers must bind to event-contract schemas.
