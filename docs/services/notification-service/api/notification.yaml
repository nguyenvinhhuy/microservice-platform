openapi: 3.1.0
info:
  title: Notification Service API
  version: 1.0.0
  description: |
    Implementation-accurate REST contract for notification-service.
    All endpoints require a validated JWT except actuator endpoints, which are not described here.
servers:
  - url: http://localhost:8004
paths:
  /notifications:
    get:
      summary: List notification history for the authenticated user
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Notification history records for the current tenant/user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationHistoryResponse'
        '401':
          description: Missing or invalid JWT.
        '403':
          description: Authenticated but not authorized by resource server policy.
  /notification-preferences:
    get:
      summary: List notification preferences for the authenticated user
      operationId: listNotificationPreferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification preferences for the current tenant/user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreferenceResponse'
        '401':
          description: Missing or invalid JWT.
        '403':
          description: Authenticated but not authorized by resource server policy.
    put:
      summary: Update notification preferences for the authenticated user
      operationId: updateNotificationPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
      responses:
        '200':
          description: Updated notification preferences for the current tenant/user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreferenceResponse'
        '400':
          description: Validation failure.
        '401':
          description: Missing or invalid JWT.
        '403':
          description: Authenticated but not authorized by resource server policy.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    NotificationHistoryResponse:
      type: object
      required:
        - id
        - tenantId
        - type
        - channel
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: integer
          format: int64
          nullable: true
        tenantId:
          type: integer
          format: int64
        type:
          type: string
        channel:
          type: string
        status:
          type: string
          enum:
            - SENT
            - FAILED
            - SKIPPED
        createdAt:
          type: string
          format: date-time
    NotificationPreferenceResponse:
      type: object
      required:
        - channel
        - enabled
        - updatedAt
      properties:
        channel:
          type: string
          enum:
            - EMAIL
            - SMS
            - PUSH
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    UpdateNotificationPreferencesRequest:
      type: object
      required:
        - preferences
      properties:
        preferences:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PreferenceUpdate'
    PreferenceUpdate:
      type: object
      required:
        - channel
        - enabled
      properties:
        channel:
          type: string
          enum:
            - EMAIL
            - SMS
            - PUSH
        enabled:
          type: boolean
