spring:
  application:
    name: dlq-replayer-service
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dlq_replayer_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${DLQ_REPLAYER_KAFKA_GROUP_ID:dlq-replayer-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

dlq:
  topic-pattern: ${DLQ_TOPIC_PATTERN:.*\\.dlq}
  consumer:
    group-id: ${DLQ_REPLAYER_KAFKA_GROUP_ID:dlq-replayer-service}

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes: service.name=${spring.application.name}

