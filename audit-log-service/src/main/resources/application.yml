spring:
  application:
    name: audit-log-service
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5439/audit_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${AUDIT_LOG_KAFKA_GROUP_ID:audit-log-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

server:
  port: ${SERVER_PORT:8005}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes: service.name=${spring.application.name}

auditlog:
  kafka:
    order-topic: ${AUDIT_KAFKA_ORDER_TOPIC:order.events}
    payment-topic: ${AUDIT_KAFKA_PAYMENT_TOPIC:payment.events}
    inventory-topic: ${AUDIT_KAFKA_INVENTORY_TOPIC:inventory.events}
    product-topic: ${AUDIT_KAFKA_PRODUCT_TOPIC:product.events}
    group-id: ${AUDIT_LOG_KAFKA_GROUP_ID:audit-log-service}
    consumer-enabled: ${AUDIT_KAFKA_CONSUMER_ENABLED:true}

