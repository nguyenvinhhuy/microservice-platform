spring.application.name=product-service
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.autoconfigure.exclude=io.opentelemetry.instrumentation.spring.autoconfigure.instrumentation.kafka.KafkaInstrumentationAutoConfiguration

# Database Configuration (Example - should be overridden by env vars in prod)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=product-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

feature.product.outbox.enabled=${FEATURE_PRODUCT_OUTBOX_ENABLED:true}
product.outbox.publisher-delay-ms=${PRODUCT_OUTBOX_PUBLISHER_DELAY_MS:2000}
product.outbox.publisher-batch-size=${PRODUCT_OUTBOX_PUBLISHER_BATCH_SIZE:50}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# OpenTelemetry Configuration (OTLP export to Jaeger)
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.resource.attributes=service.name=${spring.application.name}
