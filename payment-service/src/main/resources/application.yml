spring:
  application:
    name: payment-service
  autoconfigure:
    exclude: io.opentelemetry.instrumentation.spring.autoconfigure.instrumentation.kafka.KafkaInstrumentationAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${PAYMENT_KAFKA_GROUP_ID:payment-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8090}

payment:
  processing:
    enabled: ${PAYMENT_PROCESSING_ENABLED:true}
  outbox:
    enabled: ${PAYMENT_OUTBOX_ENABLED:true}
    publisher-delay-ms: ${PAYMENT_OUTBOX_PUBLISHER_DELAY_MS:2000}
    publisher-batch-size: ${PAYMENT_OUTBOX_PUBLISHER_BATCH_SIZE:50}
  kafka:
    inventory-topic: ${PAYMENT_INVENTORY_TOPIC:inventory.events}
    events-topic: ${PAYMENT_EVENTS_TOPIC:payment.events}
    retry-topic: ${PAYMENT_EVENTS_RETRY_TOPIC:inventory.events.retry}
    dlq-topic: ${PAYMENT_EVENTS_DLQ_TOPIC:inventory.events.dlq}
    consumer:
      enabled: ${PAYMENT_KAFKA_CONSUMER_ENABLED:false}
  provider:
    simulated:
      enabled: ${PAYMENT_PROVIDER_SIMULATED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  retry:
    instances:
      paymentProvider:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0
        exponential-max-wait-duration: 2s
        randomization-factor: 0.5
        retry-exceptions:
          - huynv.paymentservice.exception.PaymentProviderTimeoutException
        ignore-exceptions:
          - huynv.paymentservice.exception.PaymentProviderDeclinedException

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes: service.name=${spring.application.name}
