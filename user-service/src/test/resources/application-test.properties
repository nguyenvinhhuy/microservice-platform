spring.datasource.url=jdbc:h2:mem:user_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.sql.init.mode=always

spring.cache.type=simple
spring.data.redis.repositories.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

spring.kafka.bootstrap-servers=localhost:9092
user-service.outbox.publisher-enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.test/realms/microservice-platform

otel.sdk.disabled=true
otel.instrumentation.logback-appender.enabled=false
otel.instrumentation.log4j-appender.enabled=false
management.tracing.enabled=false

