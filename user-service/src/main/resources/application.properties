spring.application.name=user-service
server.port=${SERVER_PORT:8001}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.threads.virtual.enabled=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:3000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:1000}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.jakarta.persistence.query.timeout=${USER_SERVICE_JPA_QUERY_TIMEOUT_MS:5000}
spring.transaction.default-timeout=15s

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}
spring.data.redis.password=${SPRING_REDIS_PASSWORD}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.cache.type=redis

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.prometheus.metrics.export.enabled=true
management.tracing.enabled=true
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}

spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=30s

user-service.max-page-size=${USER_SERVICE_MAX_PAGE_SIZE:100}
user-service.kafka.events-topic=${USER_EVENTS_TOPIC:user.events}
user-service.kafka.dlq-topic=${USER_EVENTS_DLQ_TOPIC:user.events.dlq}
user-service.cache.user-lookup-ttl=${USER_CACHE_USER_LOOKUP_TTL:10m}
user-service.cache.preferences-ttl=${USER_CACHE_PREFERENCES_TTL:5m}
user-service.outbox.publisher-enabled=${USER_OUTBOX_PUBLISHER_ENABLED:true}
user-service.outbox.batch-size=${USER_OUTBOX_BATCH_SIZE:100}
user-service.outbox.fixed-delay=${USER_OUTBOX_FIXED_DELAY:1s}
user-service.outbox.send-timeout=${USER_OUTBOX_SEND_TIMEOUT:10s}
user-service.outbox.max-attempts=${USER_OUTBOX_MAX_ATTEMPTS:5}
user-service.outbox.initial-backoff=${USER_OUTBOX_INITIAL_BACKOFF:250ms}
user-service.outbox.backoff-multiplier=${USER_OUTBOX_BACKOFF_MULTIPLIER:2.0}
user-service.outbox.max-backoff=${USER_OUTBOX_MAX_BACKOFF:5s}
user-service.outbox.processing-timeout=${USER_OUTBOX_PROCESSING_TIMEOUT:1m}
user-service.idempotency.enabled=${USER_API_IDEMPOTENCY_ENABLED:true}
user-service.idempotency.ttl=${USER_API_IDEMPOTENCY_TTL:24h}
user-service.idempotency.cleanup-fixed-delay=${USER_API_IDEMPOTENCY_CLEANUP_FIXED_DELAY:1h}
user-service.security.internal.allowed-authorized-parties=${USER_INTERNAL_ALLOWED_AZP:gateway-service,order-service,payment-service,inventory-service,product-service,notification-service,audit-log-service,file-service,order-view-service,product-view-service,dlq-replayer-service}
user-service.security.internal.allowed-audiences=${USER_INTERNAL_ALLOWED_AUDIENCES:user-service-internal,user-service}
user-service.security.internal.allowed-scopes=${USER_INTERNAL_ALLOWED_SCOPES:user-service.internal,internal:user-service:read}
user-service.security.internal.allowed-service-roles=${USER_INTERNAL_ALLOWED_SERVICE_ROLES:service_user_reader,service-user-reader}
