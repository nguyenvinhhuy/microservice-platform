<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Order Confirmation</title>
</head>
<body>
<h2>Order Confirmation</h2>
<p th:if="${orderId != null}">
    Your order <strong th:text="${orderId}">ORDER_ID</strong> has been created successfully.
</p>
<p th:if="${status != null}">
    Status: <span th:text="${status}">STATUS</span>
</p>
<p th:if="${totalAmount != null}">
    Total: <span th:text="${totalAmount}">TOTAL</span>
    <span th:text="${currency}">CURRENCY</span>
</p>
<p th:if="${timestamp != null}">
    Created at: <span th:text="${timestamp}">TIMESTAMP</span>
</p>
</body>
</html>
