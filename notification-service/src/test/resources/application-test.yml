spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/oauth2/jwks
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:h2:mem:notification_test_${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: notification-service-test
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all

notification:
  kafka:
    group-id: notification-service-test
    consumer-enabled: true
    listener-concurrency: 1
    dlq-topic: notification.events.dlq
  dispatcher:
    enabled: false
  redis-cache:
    enabled: false
  retry:
    max-attempts: 1
    initial-interval-ms: 1
    multiplier: 1.0
    max-interval-ms: 2
  outbox:
    publisher:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

