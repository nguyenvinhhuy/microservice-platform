spring.datasource.url=jdbc:h2:mem:file_service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.sql.init.mode=always

spring.cache.type=simple
spring.data.redis.repositories.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

spring.kafka.bootstrap-servers=localhost:9092

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/test-issuer

file-service.kafka.scan-consumer-enabled=false
file-service.storage.endpoint=http://localhost:9000
file-service.storage.public-base-url=http://localhost:9000
file-service.storage.access-key=minioadmin
file-service.storage.secret-key=minioadmin
file-service.storage.bucket-strategy=SHARED
file-service.storage.shared-bucket=test-files
file-service.storage.max-upload-size-bytes=26214400
file-service.outbox.batch-size=10
file-service.outbox.fixed-delay=PT10S
file-service.outbox.send-timeout=PT1S
file-service.outbox.processing-timeout=PT10S

notification.kafka.dlq-topic=file.events.dlq
notification.retry.max-attempts=2
notification.outbox.publisher.batch-size=10
notification.outbox.publisher.fixed-delay-ms=10000
notification.outbox.publisher.send-timeout-ms=1000
notification.outbox.publisher.processing-timeout-ms=10000

management.health.redis.enabled=false
management.health.kafka.enabled=false
management.endpoint.health.group.readiness.include=readinessState,db,minio

