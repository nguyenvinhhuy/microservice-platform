spring.application.name=file-service
server.port=${SERVER_PORT:8003}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/file_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:file_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:file_password}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}
spring.data.redis.timeout=2s
spring.cache.type=redis

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${file-service.kafka.scan-consumer-group-id}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.ack-mode=record

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/platform}

spring.servlet.multipart.max-file-size=${FILE_SERVICE_MAX_MULTIPART_SIZE:25MB}
spring.servlet.multipart.max-request-size=${FILE_SERVICE_MAX_MULTIPART_SIZE:25MB}

management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.redis.enabled=true
management.health.kafka.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.prometheus.access=read_only
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db,redis,kafka,minio
management.prometheus.metrics.export.enabled=true

file-service.storage.endpoint=${MINIO_URL:http://localhost:9000}
file-service.storage.public-base-url=${MINIO_PUBLIC_URL:${MINIO_URL:http://localhost:9000}}
file-service.storage.region=${MINIO_REGION:us-east-1}
file-service.storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
file-service.storage.secret-key=${MINIO_SECRET_KEY:minioadmin}
file-service.storage.shared-bucket=${FILE_SERVICE_SHARED_BUCKET:platform-files}
file-service.storage.bucket-prefix=${FILE_SERVICE_BUCKET_PREFIX:tenant-files}
file-service.storage.bucket-strategy=${FILE_SERVICE_BUCKET_STRATEGY:SHARED}
file-service.storage.presigned-upload-ttl=PT15M
file-service.storage.presigned-download-ttl=PT15M
file-service.storage.download-ticket-ttl=PT5M
file-service.storage.max-upload-size-bytes=${FILE_SERVICE_MAX_UPLOAD_SIZE_BYTES:26214400}
file-service.storage.allowed-extensions=pdf,jpg,jpeg,png,gif,webp,txt
file-service.storage.allowed-mime-types=application/pdf,image/jpeg,image/png,image/gif,image/webp,text/plain
file-service.storage.encryption-mode=${FILE_SERVICE_ENCRYPTION_MODE:NONE}
file-service.storage.encryption-key-reference=${FILE_SERVICE_ENCRYPTION_KEY_REFERENCE:}
file-service.storage.quarantine-bucket=${FILE_SERVICE_QUARANTINE_BUCKET:platform-files-quarantine}

file-service.kafka.events-topic=${FILE_EVENTS_TOPIC:file.events}
file-service.kafka.dlq-topic=${FILE_EVENTS_DLQ_TOPIC:file.events.dlq}
file-service.kafka.scan-results-topic=${FILE_SCAN_RESULTS_TOPIC:file.scan.results}
file-service.kafka.scan-consumer-group-id=${FILE_SCAN_RESULTS_GROUP:file-service-scan-results}
file-service.kafka.scan-consumer-enabled=${FILE_SCAN_RESULTS_CONSUMER_ENABLED:true}

file-service.scan.worker-enabled=${FILE_SCAN_WORKER_ENABLED:true}
file-service.scan.worker-consumer-group-id=${FILE_SCAN_WORKER_GROUP:file-service-scan-worker}
file-service.scan.mode=${FILE_SCAN_MODE:CLAMAV}
file-service.scan.host=${CLAMAV_HOST:clamav}
file-service.scan.port=${CLAMAV_PORT:3310}
file-service.scan.timeout=PT15S
file-service.scan.max-retries=3
file-service.scan.retry-delay=PT5M

file-service.cache.metadata-ttl=PT10M
file-service.cache.quota-ttl=PT5M
file-service.cache.presign-state-ttl=PT20M

file-service.security.internal.allowed-authorized-parties=${FILE_INTERNAL_ALLOWED_AZP:gateway-service,notification-service}
file-service.security.internal.allowed-audiences=${FILE_INTERNAL_ALLOWED_AUD:file-service-internal}
file-service.security.internal.allowed-scopes=${FILE_INTERNAL_ALLOWED_SCOPES:file-service.internal}
file-service.security.internal.allowed-service-roles=${FILE_INTERNAL_ALLOWED_SERVICE_ROLES:ROLE_SERVICE,ROLE_ADMIN}

file-service.quota.default-quota-bytes=${FILE_SERVICE_DEFAULT_QUOTA_BYTES:262144000}
file-service.quota.pending-upload-ttl=PT1H

file-service.idempotency.enabled=true
file-service.idempotency.ttl=PT24H
file-service.idempotency.cleanup-fixed-delay=PT1H

file-service.rate-limit.enabled=true
file-service.rate-limit.upload-requests-per-minute=30
file-service.rate-limit.download-requests-per-minute=120
file-service.rate-limit.presign-requests-per-minute=60
file-service.rate-limit.ip-burst-per-minute=240

file-service.multipart.enabled=true
file-service.multipart.session-ttl=PT6H
file-service.multipart.presigned-part-ttl=PT20M
file-service.multipart.cleanup-fixed-delay=PT30M
file-service.multipart.max-part-count=10000

file-service.outbox.max-attempts=5
file-service.outbox.batch-size=200
file-service.outbox.fixed-delay=PT1S
file-service.outbox.send-timeout=PT10S
file-service.outbox.processing-timeout=PT1M

notification.kafka.dlq-topic=${file-service.kafka.dlq-topic}
notification.retry.max-attempts=${file-service.outbox.max-attempts}
notification.outbox.publisher.batch-size=${file-service.outbox.batch-size}
notification.outbox.publisher.fixed-delay-ms=1000
notification.outbox.publisher.send-timeout-ms=10000
notification.outbox.publisher.processing-timeout-ms=60000

logging.level.huynv.fileservice=INFO
logging.level.huynv.eventinfra.outbox=INFO
