spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/microservice-platform}
  codec:
    max-in-memory-size: ${GATEWAY_CODEC_MAX_IN_MEMORY_SIZE:2MB}
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:50}
            redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:100}
            key-resolver: "#{@tenantUserRouteKeyResolver}"
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service:8001}
          predicates:
            - Path=/api/users/**,/api/users
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: user-service
                fallbackUri: forward:/__gateway/fallback/user-service
            - name: Retry
              args:
                retries: ${GATEWAY_IDEMPOTENT_RETRY_COUNT:2}
                methods: GET,HEAD
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: ${GATEWAY_IDEMPOTENT_RETRY_FIRST_BACKOFF:50ms}
                  maxBackoff: ${GATEWAY_IDEMPOTENT_RETRY_MAX_BACKOFF:500ms}
                  factor: 2
                  basedOnPreviousValue: true
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-service:8002}
          predicates:
            - Path=/api/orders/**,/api/orders
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: order-service
                fallbackUri: forward:/__gateway/fallback/order-service
            - name: Retry
              args:
                retries: ${GATEWAY_IDEMPOTENT_RETRY_COUNT:2}
                methods: GET,HEAD
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: ${GATEWAY_IDEMPOTENT_RETRY_FIRST_BACKOFF:50ms}
                  maxBackoff: ${GATEWAY_IDEMPOTENT_RETRY_MAX_BACKOFF:500ms}
                  factor: 2
                  basedOnPreviousValue: true
        - id: file-service
          uri: ${FILE_SERVICE_URL:http://file-service:8003}
          predicates:
            - Path=/api/files/**,/api/files
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: file-service
                fallbackUri: forward:/__gateway/fallback/file-service
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8004}
          predicates:
            - Path=/api/notifications/**,/api/notifications
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: notification-service
                fallbackUri: forward:/__gateway/fallback/notification-service
        - id: audit-log-service
          uri: ${AUDIT_LOG_SERVICE_URL:http://audit-log-service:8005}
          predicates:
            - Path=/api/audit/**,/api/audit
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: audit-log-service
                fallbackUri: forward:/__gateway/fallback/audit-log-service
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://product-service:8006}
