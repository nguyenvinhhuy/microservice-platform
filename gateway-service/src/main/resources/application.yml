        - id: order-view-service
          uri: ${ORDER_VIEW_SERVICE_URL:http://order-view-service:8011}
          predicates:
            - Path=/api/views/orders/**,/api/views/orders
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: order-view-service
                fallbackUri: forward:/__gateway/fallback/order-view-service
            - name: Retry
              args:
                retries: ${GATEWAY_IDEMPOTENT_RETRY_COUNT:2}
                methods: GET,HEAD
                statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
                backoff:
                  firstBackoff: ${GATEWAY_IDEMPOTENT_RETRY_FIRST_BACKOFF:50ms}
                  maxBackoff: ${GATEWAY_IDEMPOTENT_RETRY_MAX_BACKOFF:500ms}
                  factor: 2
                  basedOnPreviousValue: true
        - id: dlq-replayer-service
          uri: ${DLQ_REPLAYER_SERVICE_URL:http://dlq-replayer-service:8012}
          predicates:
            - Path=/api/admin/dlq/**,/api/admin/dlq
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: dlq-replayer-service
                fallbackUri: forward:/__gateway/fallback/dlq-replayer-service

server:
  port: ${SERVER_PORT:8000}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  max-http-request-header-size: ${GATEWAY_MAX_REQUEST_HEADER_SIZE:16KB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO

gateway:
  security:
    require-https: ${GATEWAY_REQUIRE_HTTPS:false}
  request:
    max-bytes: ${GATEWAY_MAX_REQUEST_BYTES:10485760}
    timeout: ${GATEWAY_REQUEST_TIMEOUT:10s}
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:*}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 10
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      user-service:
        baseConfig: default
      order-service:
        baseConfig: default
      file-service:
        baseConfig: default
      notification-service:
        baseConfig: default
      audit-log-service:
        baseConfig: default
      product-service:
        baseConfig: default
      payment-service:
        baseConfig: default
      inventory-service:
        baseConfig: default
      product-view-service:
        baseConfig: default
      order-view-service:
        baseConfig: default
      dlq-replayer-service:
        baseConfig: default
