        - id: product-view-service
          uri: ${PRODUCT_VIEW_SERVICE_URL:http://product-view-service:8010}
          predicates:
            - Path=/api/views/products/**,/api/views/products
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: product-view-service
