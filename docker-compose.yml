        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - order-db
      - redis
      - kafka

  # File Service (Port 8003)
  file-service:
    container_name: file-service
    image: your-registry/file-service:latest
    build:
      context: ./file-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8003
      SPRING_DATASOURCE_URL: jdbc:postgresql://file-db:5432/file_db
      SPRING_DATASOURCE_USERNAME: file
      SPRING_DATASOURCE_PASSWORD: ${FILE_DB_PASSWORD:-file123}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - file-db
      - minio
      - kafka

  # Notification Service (Port 8004)
  notification-service:
    container_name: notification-service
    image: your-registry/notification-service:latest
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
