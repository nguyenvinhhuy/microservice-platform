inventory:
  reservation:
    # The duration for which a stock reservation is held before it expires.
    # Format: ISO-8601 duration (e.g., PT10M for 10 minutes, PT1H for 1 hour).
    expiration: PT10M
    # How often the scheduler runs to clean up expired reservations (in milliseconds).
    expiration-check-interval: "60000"
  outbox:
    publisher-delay-ms: ${INVENTORY_OUTBOX_PUBLISHER_DELAY_MS:2000}
    publisher-batch-size: ${INVENTORY_OUTBOX_PUBLISHER_BATCH_SIZE:50}

# ShedLock configuration to ensure the scheduler runs on only one instance.
spring:
  application:
    name: inventory-service
  autoconfigure:
    exclude: io.opentelemetry.instrumentation.spring.autoconfigure.instrumentation.kafka.KafkaInstrumentationAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

feature:
  inventory:
    reservation:
      enabled: ${FEATURE_INVENTORY_RESERVATION_ENABLED:true}
    outbox:
      enabled: ${FEATURE_INVENTORY_OUTBOX_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Enable the scheduler
shedlock:
  enabled: true

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes: service.name=${spring.application.name}
