---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-service-config
  namespace: microservice-platform
  labels:
    app: file-service
    platform.microservice.io/component: file-service
data:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8003"
  FILE_SERVICE_SHARED_BUCKET: platform-files
  FILE_SERVICE_BUCKET_PREFIX: tenant-files
  FILE_SERVICE_BUCKET_STRATEGY: SHARED
  FILE_EVENTS_TOPIC: file.events
  FILE_EVENTS_DLQ_TOPIC: file.events.dlq
  FILE_SCAN_RESULTS_TOPIC: file.scan.results
  FILE_SCAN_RESULTS_GROUP: file-service-scan-results
  FILE_SCAN_RESULTS_CONSUMER_ENABLED: "true"
  FILE_INTERNAL_ALLOWED_AZP: gateway-service,notification-service
  FILE_INTERNAL_ALLOWED_AUD: file-service-internal
  FILE_INTERNAL_ALLOWED_SCOPES: file-service.internal
  FILE_INTERNAL_ALLOWED_SERVICE_ROLES: ROLE_SERVICE,ROLE_ADMIN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: microservice-platform
  labels:
    app: file-service
    platform.microservice.io/component: file-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
        platform.microservice.io/component: file-service
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: file-service
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: file-service
      containers:
        - name: file-service
          image: file-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          envFrom:
            - configMapRef:
                name: file-service-config
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: FILE_SERVICE_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: FILE_SERVICE_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: FILE_SERVICE_DATASOURCE_PASSWORD
            - name: MINIO_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MINIO_URL
            - name: MINIO_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MINIO_PUBLIC_URL
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: MINIO_SECRET_KEY
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_REDIS_HOST
            - name: SPRING_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_REDIS_PORT
            - name: SPRING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SPRING_REDIS_PASSWORD
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KEYCLOAK_ISSUER_URI
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: microservice-platform
  labels:
    app: file-service
    platform.microservice.io/component: file-service
spec:
  selector:
    app: file-service
  ports:
    - name: http
      port: 8003
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: file-service
  namespace: microservice-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: file-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: file-service
  namespace: microservice-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: file-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

