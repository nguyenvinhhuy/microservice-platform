---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: microservice-platform
data:
  NODE_ENV: "production"
  ANGULAR_API_URL: "http://gateway-service:8000/api"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-broker:29092"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-db:5432/microservice_db"
  SPRING_DATASOURCE_USERNAME: "admin"
  SPRING_REDIS_HOST: "redis-cache"
  SPRING_REDIS_PORT: "6379"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: microservice-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: "admin123"
  REDIS_PASSWORD: "redis123"
  SPRING_DATASOURCE_PASSWORD: "admin123"
